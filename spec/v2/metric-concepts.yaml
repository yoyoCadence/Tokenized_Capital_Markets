  - {concept_id: secz_nonoperating_assets, description: 'Issuer nonoperating assets available to common enterprise bridge', unit: USD, measure_kind: STOCK, permitted_scopes: [REALIZED]}
  - {concept_id: secz_basic_provider_cap, description: 'Third-party basic common equity market cap for reconciliation', unit: USD, measure_kind: STOCK, permitted_scopes: [REALIZED]}
