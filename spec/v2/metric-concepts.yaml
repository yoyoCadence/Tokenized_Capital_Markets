  - {concept_id: uni_burn_value, description: 'Actually executed UNI burns valued in USD; not merely fees collected', unit: USD, measure_kind: FLOW, permitted_scopes: [REALIZED]}
  - {concept_id: uni_distribution_value, description: 'Actually distributed UNI valued in USD, distinct from projected growth budget', unit: USD, measure_kind: FLOW, permitted_scopes: [REALIZED, MODELED_HORIZON]}
  - {concept_id: uni_dilution_value, description: 'Actual other dilution valued in USD', unit: USD, measure_kind: FLOW, permitted_scopes: [REALIZED]}
  - {concept_id: uni_circulating_supply, description: 'Observed circulating UNI supply', unit: UNI, measure_kind: STOCK, permitted_scopes: [REALIZED]}
