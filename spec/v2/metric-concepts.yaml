schema_version: '2.0'
concepts:
  - {concept_id: secz_revenue, description: 'Securitize quarterly revenue evidence', unit: USD, measure_kind: FLOW, permitted_scopes: [REALIZED]}
  - {concept_id: secz_revenue_musd, description: 'Issuer-reported revenue in USD millions; raw scale', unit: USD_MILLION, measure_kind: FLOW, permitted_scopes: [REALIZED]}
  - {concept_id: secz_revenue_eur, description: 'Issuer-reported revenue in EUR; raw currency', unit: EUR, measure_kind: FLOW, permitted_scopes: [REALIZED]}
  - {concept_id: secz_revenue_cagr, description: 'Comparable annual issuer-revenue growth; derived only', unit: FRACTION, measure_kind: RATIO, permitted_scopes: [REALIZED]}
  - {concept_id: secz_nyse_price, description: 'NYSE common share quote in USD; venue and timestamp required', unit: USD_PER_SHARE, measure_kind: PRICE, permitted_scopes: [REALIZED]}
  - {concept_id: secz_basic_shares, description: 'Common shares outstanding, basic basis, not legacy CEPT', unit: SHARE, measure_kind: STOCK, permitted_scopes: [REALIZED]}
  - {concept_id: secz_diluted_shares, description: 'As-converted diluted common share count with explicit source method', unit: SHARE, measure_kind: STOCK, permitted_scopes: [REALIZED]}
  - {concept_id: secz_interest_bearing_debt, description: 'Issuer interest-bearing debt', unit: USD, measure_kind: STOCK, permitted_scopes: [REALIZED]}
  - {concept_id: secz_preferred_claims, description: 'Issuer preferred equity claims senior to common', unit: USD, measure_kind: STOCK, permitted_scopes: [REALIZED]}
  - {concept_id: secz_noncontrolling_interest, description: 'Issuer noncontrolling interest', unit: USD, measure_kind: STOCK, permitted_scopes: [REALIZED]}
