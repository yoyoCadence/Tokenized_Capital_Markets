  - {concept_id: uni_circulating_provider_cap, description: 'Third-party circulating UNI cap for reconciliation', unit: USD, measure_kind: STOCK, permitted_scopes: [REALIZED]}
  - {concept_id: uni_equity_tam, description: 'Scenario annual horizon equity addressable market', unit: USD, measure_kind: STOCK, permitted_scopes: [MODELED_HORIZON]}
  - {concept_id: uni_tokenization_penetration, description: 'Scenario penetration of equity TAM', unit: FRACTION, measure_kind: RATIO, permitted_scopes: [MODELED_HORIZON]}
  - {concept_id: uni_turnover, description: 'Annual scenario turnover', unit: FRACTION, measure_kind: RATIO, permitted_scopes: [MODELED_HORIZON]}
  - {concept_id: uni_onchain_share, description: 'Scenario onchain share', unit: FRACTION, measure_kind: RATIO, permitted_scopes: [MODELED_HORIZON]}
  - {concept_id: uni_amm_share, description: 'Scenario AMM share', unit: FRACTION, measure_kind: RATIO, permitted_scopes: [MODELED_HORIZON]}
  - {concept_id: uni_market_share, description: 'Scenario Uniswap market share', unit: FRACTION, measure_kind: RATIO, permitted_scopes: [MODELED_HORIZON]}
  - {concept_id: uni_required_yield, description: 'Analyst hurdle, not an observed return', unit: FRACTION, measure_kind: RATIO, permitted_scopes: [MODELED_HORIZON]}
  - {concept_id: xlm_network_operations, description: 'Quarterly network operations; activity is not holder capture', unit: COUNT, measure_kind: COUNT, permitted_scopes: [REALIZED]}
  - {concept_id: xlm_price, description: 'Native XLM quote in USD, distinct from wrapped tokens', unit: USD_PER_XLM, measure_kind: PRICE, permitted_scopes: [REALIZED]}
  - {concept_id: xlm_circulating_supply, description: 'Observed circulating native XLM supply', unit: XLM, measure_kind: STOCK, permitted_scopes: [REALIZED]}
  - {concept_id: xlm_total_supply, description: 'Observed total native XLM supply', unit: XLM, measure_kind: STOCK, permitted_scopes: [REALIZED]}
  - {concept_id: xlm_circulating_provider_cap, description: 'Third-party circulating native XLM cap', unit: USD, measure_kind: STOCK, permitted_scopes: [REALIZED]}
  - {concept_id: securitize_inc_revenue, description: 'Reported operating-company Securitize Inc. revenue, separate from listed issuer inputs', unit: USD, measure_kind: FLOW, permitted_scopes: [REALIZED]}
