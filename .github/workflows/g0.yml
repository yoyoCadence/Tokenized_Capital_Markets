name: G0 integration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements-g0.txt
      - run: python -m scripts.g0_gate
