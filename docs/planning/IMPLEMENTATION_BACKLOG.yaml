    effort_points: 3
    depends_on: [P2-06, P2-09]
    outputs: [weekly research packet, counterevidence section, causal diff]
    acceptance:
      - 有市場要求、實現/模型 economics、敏感度、反證與missing。
      - source/record/assumption/scenario/formula/rule/price 變更皆可辨。
      - 多因素交互作用不冒稱唯一因果；state 不轉 BUY/HOLD/SELL。
  - id: P2-12
    title: 使用驗收與 G2
    phase: P2
    priority: P1
    status: PLANNED
    owner_role: user_research
    effort_points: 2
    depends_on: [P1-09, P2-08, P2-10, P2-11]
    outputs: [task-based usability log, G2 report, revised time targets]
    acceptance:
      - 使用者能由真實變更完成一次限定決策研究並找到不確定性。
      - 記錄實際每週負擔，不以漂亮 UI 取代研究價值。
      - 評估三分鐘找變更/三十分鐘週檢視之初始目標，調整留理由。
  - id: P3-01
    title: Edge experiment 預先登錄
    phase: P3
    priority: P0
    status: PLANNED
    owner_role: research
    effort_points: 3
    depends_on: [P2-12]
    outputs: [frozen experiment cards, benchmark plan, trial registry]
    acceptance:
      - claim/population/horizon/outcome/cost/stop/analysis 在結果前定義。
      - 首個 UNI gross-vs-net 比較與投資交易假說分開。
      - 看過結果的變更另開版本，不修改原試驗。
  - id: P3-02
    title: Forecast journal 與解析
    phase: P3
    priority: P0
    status: PLANNED
    owner_role: engineering_research
    effort_points: 3
    depends_on: [P3-01]
    outputs: [forecast ledger, resolution records, calibration outputs]
    acceptance:
      - snapshot/cutoff/probability 或 interval/resolution source 齊備。
      - 二元、連續量、排序、投資結果採適當評分且明示樣本數。
      - 未解析、取消、錯誤、修正版均保留。
  - id: P3-03
    title: 歷史可知重建與樣本外評估協議
    phase: P3
    priority: P0
    status: PLANNED
    owner_role: engineering_research
    effort_points: 5
    depends_on: [P0-04, P3-01]
    outputs: [point-in-time dataset manifests, holdout/walk-forward protocol]
    acceptance:
      - 無 availability 證據資料不進歷史策略，寧可開始 forward journal。
      - universe/survivorship/restatement/corporate actions 版本可查。
      - 重疊 labels、TTM、事件更新相依性與試驗選擇偏誤明示。
  - id: P3-04
    title: 可成交條件與成本模型
    phase: P3
    priority: P0
    status: PLANNED
    owner_role: engineering_research
    effort_points: 5
    depends_on: [P1-04, P3-01]
    outputs: [cost registry, fill assumptions, execution constraint tests]
    acceptance:
      - 決策之後才可成交；bid/ask/時段/size/延遲/partial fill 有政策。
      - fees/spread/slippage/FX/gas/funding 適用者納入。
      - depth/tax 未知有區間或unknown，不自稱完整稅後淨利。
  - id: P3-05
    title: 有權利依據的預期報酬情境
    phase: P3
    priority: P1
    status: PLANNED
    owner_role: engineering_research
    effort_points: 5
    depends_on: [P2-06, P3-04]
    outputs: [terminal wealth scenarios, distributions, identifiability warnings]
    acceptance:
      - expected wealth 與 scenario CAGR 不錯誤混算，cash flow 時點明示。
      - UNI burn 不作現金分配重算，SECZ EV/股數橋接正確。
      - XLM price mapping 不可識別時可拒算，機率標為假設。
  - id: P3-06
    title: 永久損失與壓力情境
    phase: P3
    priority: P1
    status: PLANNED
    owner_role: research
    effort_points: 3
    depends_on: [P3-01, P3-05]
    outputs: [loss definitions, recovery scenarios, correlated exposure map]
    acceptance:
      - 永久損失和短期 drawdown 分離，horizon/currency/recovery 明確。
      - regulation/capture撤除/dilution/security/custody/liquidity 有適用情境。
      - 未校準 probability 明示；三資產共同風險不當獨立。
  - id: P3-07
    title: 可重播 paper ledger
    phase: P3
    priority: P0
    status: PLANNED
    owner_role: engineering
    effort_points: 5
    depends_on: [P3-02, P3-04, P3-05]
    outputs: [paper positions/cash/fills, reconciliation, no-trade records]
    acceptance:
      - 模擬、研究與真實帳本分離，所有假設成交可重播。
      - 現金、公司行動、FX、費用與資金流對帳一致。
      - 錯失交易和不可成交保留，不能挑成功 fills。
  - id: P3-08
    title: 固定基準、績效與歸因
    phase: P3
    priority: P0
    status: PLANNED
    owner_role: engineering_research
    effort_points: 5
    depends_on: [P3-03, P3-07]
    outputs: [benchmark ledger, net-performance report, uncertainty/attribution]
    acceptance:
      - benchmark weights/rebalance/cost/cash/eligibility 事前固定。
      - gross/net/TWR/MWR/drawdown/turnover 適用口徑明示。
      - beta/樣本依賴/試驗數/離群事件與成本敏感度不省略。
  - id: P3-09
    title: 影子運行與研究專案 ROI
    phase: P3
    priority: P1
    status: PLANNED
    owner_role: research
    effort_points: 3
    depends_on: [P3-06, P3-08]
    outputs: [operational journal, matured forecast scores, cost/time ledger]
    acceptance:
      - 初始 8–12 週運作觀察，不冒稱長期 thesis 已驗證。
      - 研究成本/時間與避免錯誤/改善決策分別評估。
      - 不足樣本保持 inconclusive，不為湊樣本增加交易。
  - id: P3-10
    title: G3 證據審查
    phase: P3
    priority: P0
    status: PLANNED
    owner_role: research_user
    effort_points: 2
    depends_on: [P3-09]
    outputs: [G3 operations report, edge verdict, continue/stop rationale]
    acceptance:
      - 計算、預測資訊、投資經濟價值三種結論分開。
      - 支持/反對/無法判定及適用範圍均附證據。
      - 通過操作驗收不自動授權資本或宣稱 alpha。
  - id: P4-01
    title: 使用者 IPS 與有限試驗授權
    phase: P4
    priority: P0
    status: PLANNED
    owner_role: user
    effort_points: 2
    depends_on: [P3-10]
    outputs: [investment policy, explicit pilot budget/limits, private data policy]
    acceptance:
      - 本金/幣別/期限/損失/流動性/venue/暴露/停止規則由使用者確定。
      - 無 alpha 證明時，若仍試行，明確記為有上限的學習試驗。
      - 沒有具體授權就只保留研究和模擬。
  - id: P4-02
    title: 私有實際帳本與人工匯入
    phase: P4
    priority: P0
    status: PLANNED
    owner_role: engineering
    effort_points: 3
    depends_on: [P4-01]
    outputs: [private portfolio import, broker reconciliation, access separation]
    acceptance:
      - 公開 repo 只含 schema/fixture；真實帳號/持倉保持私有。
      - fills/cash/corporate actions/FX 對帳與去重通過。
      - 無自動下單、秘密金鑰或資金轉移功能。
  - id: P4-03
    title: 人工有限 pilot
    phase: P4
    priority: P1
    status: PLANNED
    owner_role: user_research
    effort_points: 3
    depends_on: [P4-02, P4-04]
    outputs: [authorized decision records, actual-vs-paper comparisons]
    acceptance:
      - 每次動作符合 IPS 與具體授權，決策前有合法 snapshot。
      - 真實、模擬成交與成本差異逐筆記錄。
      - 拒絕/未成交/停止均記錄，無自動資本擴張。
  - id: P4-04
    title: Pilot 故障、風險與停止演練
    phase: P4
    priority: P0
    status: PLANNED
    owner_role: user_engineering
    effort_points: 2
    depends_on: [P4-02]
    outputs: [recovery/stop runbook, risk review log]
    acceptance:
      - 資料故障、thesis 變化、資本限制三種處置分開。
      - 不可取得報價、venue 中斷、模型錯誤有人工處理路徑。
      - 停止/復原不刪除歷史，不假設可立即成交退出。
  - id: P4-05
    title: G4 結案與規模決策
    phase: P4
    priority: P1
    status: PLANNED
    owner_role: user_research
    effort_points: 2
    depends_on: [P4-03, P4-04]
    outputs: [pilot review, capacity/risk reassessment, explicit next decision]
    acceptance:
      - 經濟結果/成本/尾端風險/樣本限制/研究時間完整報告。
      - 擴大資本需新的預算與授權；正報酬不自動通過。
      - 可以停止、保持規模或縮小範圍，理由封存。
  - id: P5-01
    title: 依證據擴展 additional asset models
    phase: P5
    priority: P2
    status: PLANNED
    owner_role: research
    effort_points: 5
    depends_on: [P2-08, P3-10]
    outputs: [new candidate evidence pack, incremental research-value case]
    acceptance:
      - 依資料可得性/value capture/可交易性選下一標的。
      - 不因敘事把 secondary node 升級 core。
      - 先驗證新增研究價值才增加專用模型。
  - id: P5-02
    title: Scheduler 與 unattended refresh
    phase: P5
    priority: P2
    status: PLANNED
    owner_role: engineering
    effort_points: 5
    depends_on: [P2-10, P3-10]
    outputs: [scheduler, retry/backoff, operational monitoring]
    acceptance:
      - 有別的立項授權、速率/成本/timeout/失敗處理政策。
      - 自動擷取不能越過 evidence review 與 publication gates。
      - 本地手動模式仍可用，無自動交易。
  - id: P5-03
    title: 自動 PR 與通知
    phase: P5
    priority: P2
    status: PLANNED
    owner_role: engineering
    effort_points: 3
    depends_on: [P5-02]
    outputs: [reviewable research PRs, opt-in material-change notifications]
    acceptance:
      - diff 有來源/假設/公式變動與測試證據，受限資料不外洩。
      - 通知對象/通道/頻率經使用者明確指定。
      - 不自動合併重大模型改動或自動下單。
  - id: P5-04
    title: 可選付費研究產品探索
    phase: P5
    priority: P2
    status: PLANNED
    owner_role: product_research
    effort_points: 3
    depends_on: [P2-12, P3-10]
    outputs: [customer problem interviews, willingness-to-pay evidence, unit economics]
    acceptance:
      - 使用者另行確認商業化目標後才立項。
      - 先證明付費/續用需求和資料再散布權，才做多租戶/billing。
      - 服務毛利與投資績效分開，不以報酬保證招攬。
  - id: P5-05
    title: Unattended API 與 provider 擴張評估
    phase: P5
    priority: P2
    status: PLANNED
    owner_role: engineering
    effort_points: 3
    depends_on: [P5-02]
    outputs: [provider cost/license comparison, secret-management plan, ADR]
    acceptance:
      - 無具體資料瓶頸不採購；API key 不入 repo，限制與失效可回退。
      - 核心模型與 provider SDK 分離。
      - 任何交易 API 整合需另立風險/安全/授權計畫，不包含在本任務。
