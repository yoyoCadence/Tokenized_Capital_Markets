# P1-03 adds an audit-only normalization registry; no real financial observations are ingested.
contract_version: '2.0-proposal.6'
status: PROPOSED
baseline_schema: spec/canonical-schema.yaml
canonical_classifications: [OBSERVED, DERIVED, ASSUMPTION, SCENARIO]
orthogonal_dimensions:
  fixture: boolean
  economic_scope: [REALIZED, RUN_RATE, MODELED_HORIZON, REVERSE_REQUIREMENT]
  knowledge_policy: [AS_KNOWN_BY_SYSTEM, PUBLIC_INFORMATION_RECONSTRUCTION]
  publication_precision: [INSTANT, DATE, UNKNOWN]
  period_basis: [SPOT, QUARTER, YTD, ANNUAL, TTM]
  missing_reason: [NOT_DISCLOSED, NOT_YET_RETRIEVED, NOT_APPLICABLE, STALE, CONFLICT, INCOMPATIBLE_PERIOD, MODEL_NOT_IDENTIFIED, LEGACY_TIME_UNKNOWN]

metric_concept:
  required: [concept_id, description, unit, measure_kind, permitted_scopes]
  fields:
    concept_id: stable_semantic_identifier
    measure_kind: [STOCK, FLOW, RATIO, PRICE, COUNT]
    permitted_scopes: nonempty_subset_of_economic_scope
    entity_type: optional_entity_or_security_type
  rule: 'A concept is a quantity, not an evidence class. Never mutate a record classification to make it fit a role.'

input_role:
  required: [role_id, concept_id, allowed_classifications, allowed_scopes, selection_policy]
  fields:
    role_id: stable_formula_or_rule_input_identifier
    selection_policy: [LATEST_ELIGIBLE_UNAMBIGUOUS, EXACT_RECORD_ID]
    required_period_basis: optional_period_basis
    required_measurement_basis: optional_partial_exact_accounting_and_fiscal_dimensions
    max_age: optional_duration_or_null
  rule: 'Filter by role, scope, period, knowledge cutoff, source, and evidence before supersession. Same-number evidence remains visible.'

normalization:
  registry: spec/v2/normalization.yaml
  signature_lock: spec/v2/normalization-lock.yaml
  mode: read_only_audit_plan_of_exact_observed_ids_and_prior_steps
  formulas: [secz_scale_musd, secz_fx_eur_usd, secz_ttm, secz_ytd_quarter, secz_revenue_cagr, uni_percent_to_bp]
  required_context: [economic_cutoff, knowledge_cutoff, valuation_at, knowledge_policy]
  output: 'DERIVED with formula ID/version/signature, ordered dependencies, transitive observed record/source IDs and fixture flag; never append to canonical ledger.'
  invariants:
    - 'Raw filing or chain quantity remains OBSERVED in its original unit. Scaling, FX and period algebra produce separate DERIVED results.'
    - 'Accounting basis, gross/net, consolidation, operations, fiscal calendar and comparability are explicit; missing metadata cannot enter normalization.'
    - 'Cumulative YTD subtraction needs adjacent labeled quarters; TTM needs four contiguous fiscal quarters; CAGR needs aligned full fiscal years and a positive material baseline.'
    - 'EUR flow uses a positive USD/EUR average rate for the exact interval; the source and availability of the rate must be verified.'
    - 'No automatic selection of conflicting or superseded exact input IDs. A manual conflict resolution is outside this audit plan.'
    - 'Normalization outputs are not yet input roles in v2 economics or thesis; later promotion needs a reviewed append-only integration.'

source_archive:
  staging_ledger: sources/staging.yaml
  adapter: MANUAL_FILE_V1
  canonical_source_optional: [document_kind, artifact_sha256, artifact_bytes, artifact_media_type, artifact_locator, review_id]
  artifact_bytes_location: external_content_addressed_store_outside_public_checkout
  invariants:
    - 'Unknown source date or failed acquisition stays in staging; review cannot promote it.'
    - 'Approved source metadata records exact digest, locator and review ID; source capture never creates an OBSERVED value.'
    - 'Raw restricted bytes and credential-bearing URLs are not written to the public repository.'
    - 'The v2 bundle archives review metadata and hashes, not the external original document bytes.'

identity_master:
  ledger: spec/v2/identity-master.yaml
  dimensions: [entities, securities, instruments, aliases, corporate_actions, research_assets, evidence]
  invariants:
    - 'Protocol, network, issuer and predecessor company IDs are distinct; ticker is a namespaced, dated instrument alias.'
    - 'Unknown alias start cannot prove historical identity; a dated lookup is public reconstruction, never system-as-known.'
    - 'NYSE SECZ and issuer tokenized SECZ share the underlying common stock but are different instruments with different access gates.'
    - 'Checked URL evidence is LINK_CHECKED_UNARCHIVED; it cannot promote a canonical source or create a financial observation.'
    - 'Research core, listing, value capture, data readiness and user-specific trading eligibility remain independent.'

economic_period:
  required: [basis, start, end]
  fields:
    basis: period_basis
    start: ISO_8601_calendar_date
    end: ISO_8601_calendar_date
    fiscal_year: optional_integer
    fiscal_quarter: optional_integer_1_to_4
    period_label: optional_original_reporting_label
  invariants:
    - 'start <= end; SPOT requires start == end.'
    - 'FLOW values need an explicit interval; STOCK and PRICE need an as_of_at or documented date-only precision.'
    - 'Fiscal dates and calendar dates are not interchangeable; TTM needs a defined trailing interval.'

knowledge_time:
  required: [publication_precision, published_at, published_on, publication_timezone, first_seen_at, ingested_at, publication_evidence]
  fields:
    published_at: timezone_aware_ISO_8601_instant_or_null
    published_on: ISO_8601_calendar_date_or_null
    publication_timezone: IANA_timezone_or_null
    first_seen_at: timezone_aware_ISO_8601_instant_or_null
    ingested_at: timezone_aware_ISO_8601_instant_or_null
    publication_evidence: {source_id: nullable_source_id, locator: nullable_locator, verification: [VERIFIED, UNVERIFIED, UNKNOWN]}
  invariants:
    - 'INSTANT requires published_at, verified evidence; DATE requires published_on and timezone for cutoff eligibility.'
    - 'UNKNOWN publication is never eligible for historical public reconstruction.'
    - 'DATE availability starts at the next local midnight after published_on, converted to UTC; never invent a time within the source date.'
    - 'If publication timezone is unknown, historical availability is unknown until corroborated.'
    - 'first_seen_at is the actual first system acquisition of this evidence version, never the economic as-of or later ingestion timestamp by inference.'
    - 'ingested_at records actual canonical acceptance, never an assumed historical timestamp.'
    - 'An exact cited source version must already have been retrieved by the record first_seen_at and ingested_at; later corroboration needs a new record and source ID.'
    - 'For system replay both publication and first_seen must be verified and <= knowledge_cutoff; ingestion must also have occurred by cutoff for an actual decision replay.'
    - 'For public reconstruction verified publication must be <= cutoff; later first_seen/ingested is allowed and marked reconstructed, not an actual prior decision.'

valuation_time:
  required: [knowledge_cutoff, valuation_at, market_cutoff_policy]
  fields:
    knowledge_cutoff: timezone_aware_ISO_8601_instant
    valuation_at: timezone_aware_ISO_8601_instant
    market_cutoff_policy: [AT_OR_BEFORE_VALUATION_AND_KNOWLEDGE, NO_PRICE]
    venue: optional_venue_or_null
    quote_max_age: optional_positive_duration
  invariants:
    - 'valuation_at cannot exceed knowledge_cutoff for an actual-decision replay.'
    - 'Market quotes require a venue, quote timestamp <= valuation_at and their own knowledge eligibility.'
    - 'A quote is never silently carried beyond quote_max_age; unknown price forbids current-price reverse underwriting.'

record:
  required: [schema_version, id, concept_id, classification, economic_scope, value, unit, fixture, economic_period, knowledge_time]
  common_optional: [entity_id, security_id, supersedes_id, as_of_at, as_of_precision, missing_reason, source_ids, input_role_id, venue, legacy_record_id, measurement_basis]
  measurement_basis: {definition_id: semantic_dictionary_id, accounting_basis: 'GAAP|IFRS|ADJUSTED|NOT_APPLICABLE', presentation: 'GROSS|NET|NOT_APPLICABLE', consolidation: 'CONSOLIDATED|SEGMENT|NOT_APPLICABLE', operations_basis: 'ALL|CONTINUING|NOT_APPLICABLE', fiscal_calendar_id: explicit_id_or_UNKNOWN, comparability: 'STANDARD|FISCAL_CHANGE|FIFTY_THREE_WEEK|PRE_POST_COMBINATION'}
  value_rule: 'Exactly one of finite numeric value and missing_reason; missing is never encoded as zero.'
  observed_required: [source_ids, as_of_at, as_of_precision]
  observed_constraints:
    - 'economic_scope must be REALIZED; a price or spot stock remains REALIZED as an observation of a moment.'
    - 'All source IDs must resolve to immutable source versions; verified time refers to the exact version used.'
    - 'Date-only stock may set as_of_at null with explicit date precision; historical intraday eligibility is then blocked.'
    - 'The local calendar date of an instant quote, including its original UTC offset, must match the reported SPOT period end.'
  assumption_required: [rationale, effective_from]
  scenario_required: [scenario_name, effective_from]
  derived_required: [formula_id, formula_version, formula_signature, dependencies, selected_record_ids, computed_at]
  derived_constraints:
    - 'Formula dependency graph, input roles, economic scope and all leaves must be preserved.'
    - 'A derived REALIZED economic measure cannot depend on forward scenario or modeled-horizon economic inputs.'
    - 'A derived scope is determined by formula/context, never by DERIVED classification alone.'
  supersession_identity: [concept_id, entity_id, security_id, classification, economic_scope, unit, economic_period, measurement_basis]
  supersession_rule: 'Append a new ID; for a restatement retain supersession identity, compare eligibility before superseding, retain unrelated conflicts.'

resolution_record:
  ledger: data/v2/resolutions/{research,demo}.yaml
  required: [id, role_id, candidate_record_ids, selected_record_ids, reason, reviewer, reviewed_at, fixture]
  invariants:
    - 'Candidate IDs refer to distinct records of the same role and economic period; selected IDs are a nonempty agreeing subset.'
    - 'A reviewed resolution cannot precede verified publication and canonical ingestion of any candidate.'
    - 'Only a decision with the exact active candidate set and reviewed_at <= knowledge_cutoff can break a conflict.'
    - 'Later candidate records invalidate a prior decision for the new set; unresolved conflict remains Unknown.'
    - 'All candidates, chosen and rejected IDs, reviewer, review time and reason remain inspectable; source tier alone is not a decision.'

quality_dimensions:
  source_tiers: distinct_source_tiers_without_confidence_score
  freshness: per_role_age_and_limit_or_explicit_unknown
  coverage: declared_source_metric_coverage_not_measurement_validation
  measurement: unverified_until_original_measurement_is_reviewed
  mechanism: assumed_or_not_assessed_separate_from_realized_evidence
  uncertainty: transitive_assumption_scenario_and_missing_record_ids
  conflict: all_active_candidates_with_cutoff_eligible_resolution_or_unresolved
  rule: 'Do not infer measurement correctness, holder capture or research confidence from a high-tier source.'

query_context:
  required: [mode, economic_cutoff, knowledge_cutoff, valuation_time, required_scope, knowledge_policy]
  fields:
    mode: [DEMO, RESEARCH]
    economic_cutoff: ISO_8601_calendar_date
    knowledge_cutoff: timezone_aware_ISO_8601_instant
    valuation_time: valuation_time
    required_scope: economic_scope
    knowledge_policy: knowledge_policy
  reject_if:
    - 'RESEARCH contains a fixture evidence leaf.'
    - 'A selected record has unknown historical availability for a historical query.'
    - 'A role has multiple unresolved eligible conflicting records.'
    - 'The economic period, unit or economic scope does not match the role.'

role_examples:
  - role_id: uni_realized_protocol_fee
    concept_id: uni_effective_protocol_fee
    allowed_classifications: [OBSERVED]
    allowed_scopes: [REALIZED]
    selection_policy: LATEST_ELIGIBLE_UNAMBIGUOUS
    required_period_basis: QUARTER
  - role_id: uni_forward_protocol_fee
    concept_id: uni_effective_protocol_fee
    allowed_classifications: [ASSUMPTION, SCENARIO]
    allowed_scopes: [MODELED_HORIZON]
    selection_policy: LATEST_ELIGIBLE_UNAMBIGUOUS
    required_period_basis: ANNUAL
  - role_id: uni_current_market_cap
    concept_id: uni_market_cap
    allowed_classifications: [OBSERVED]
    allowed_scopes: [REALIZED]
    selection_policy: LATEST_ELIGIBLE_UNAMBIGUOUS
    required_period_basis: SPOT

legacy_policy:
  original_record_immutable: true
  original_snapshot_immutable: true
  unproven_published_at: null
  unproven_first_seen_at: null
  unproven_ingested_at: null
  legacy_economic_scope: UNKNOWN_PENDING_MAPPING
  historical_replay_eligible_without_verified_time: false
  v1_fixture_remains_fixture: true
